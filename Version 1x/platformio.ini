[env:attiny85]
platform = atmelavr
board = attiny85
framework = arduino

; Clock speed
board_build.f_cpu = 8000000L

; Use Arduino Uno as ISP programmer
upload_protocol = stk500v1
upload_flags =
    -P$UPLOAD_PORT
    -b19200

upload_port = COM5  ; change this to your Uno's COM port